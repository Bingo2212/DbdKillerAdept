    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = "style.css?v=" + new Date().getTime();
        document.head.appendChild(link);
      });
    </script>
    <style>
      body {
        font-family: sans-serif;
        background-color: #1a1a1a;
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        margin: 0;
        height: 100vh;
        justify-content: flex-start;
      }

      #search {
        padding: 10px;
        width: 300px;
        margin-bottom: 20px;
        border-radius: 5px;
        font-size: 16px;
        flex-shrink: 0;
      }

      .icons-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        max-width: 1000px;
        margin-top: 20px;
      }

      .icon {
        position: relative;
        width: 225px;
        max-width: 250px;
        height: 350px;
        border: 2px solid #444;
        border-radius: 10px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .icon-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        opacity: 0;
        transition: opacity 0.3s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        color: white;
        font-size: 18px;
        text-align: center;
        padding: 20px 0;
      }

      .icon-overlay span {
        margin-bottom: 15px;
      }

      .icon-images {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        width: 100%;
        margin-top: 10px;
      }

      .icon-images img {
        width: 100%;
        height: 80px;
        object-fit: cover;
        border-radius: 5px;
        transition: transform 0.3s ease;
      }

      .icon-images img:hover {
        transform: scale(1.05);
      }

      .icon-images .bottom-img {
        grid-column: 1 / -1; /* Span full width */
        margin-top: 10px;
        width: 50%; /* Make it the same width as the top images */
        height: 80px; /* Same height as top images */
        margin-left: auto;
        margin-right: auto;
      }

      .icon:hover .icon-overlay {
        opacity: 1;
      }

      .icon-content {
        position: relative;
        bottom: 10px;
        transform: translateX(-50%);
        width: 100%;
        text-align: center;
        color: white;
        opacity: 0;
        transition: opacity 0.3s ease;
        padding: 10px;
        background: rgba(0, 0, 0, 0.6);
        height: 100%;
        display: flex;
        align-items: center;
      }

      .icon:hover .icon-content {
        opacity: 1;
      }

      .icon-name {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 18px;
        font-weight: bold;
        color: #fff;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .icon:hover .icon-name {
        opacity: 1;
      }

      .icon.checked::after {
        content: "✔";
        position: absolute;
        top: 5px;
        right: 5px;
        font-size: 24px;
        color: lime;
        background: rgba(0, 0, 0, 0.6);
        border-radius: 50%;
        padding: 4px;
      }

      .icon.checked {
        opacity: 0.5;
      }

      .buttons {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
      }

      .buttons button {
        padding: 12px 24px;
        font-size: 18px;
        border: none;
        background-color: #2a2a2a;
        color: white;
        cursor: pointer;
        border-radius: 8px;
        transition: background-color 0.3s;
      }

      .buttons button:hover {
        background-color: #3a3a3a;
      }

      .buttons button.active {
        background-color: #aaa;
        color: black;
      }
    </style>

        return `<span style='color: #ff00ff'>${text}</span>`;

        "David King": {
          perk1: {

        "Kate Denson": {

          perk2: {

        "Quentin Smith": {

          perk3: {

        "David Tapp": {
          perk1: {
            name: "Tenacity",
            description:`While downed:<ul><li>You gain ${tiers(30, 40, 50)}% ${colorC("Haste")}.</li><li>You can crawl and recover at the same time.</li><li>Your Grunts of Pain are <b>75</b> quieter.</li><li>The Killer cannot see your Aura.</li></ul>`,

          perk2: {
            name: "Detective\'s Hunch",

          perk3: {

          },
        },
        "Adam Francis": {
          perk1: {
            name: "Diversion",
            description:`After hiding for ${tiers(30, 25, 20)}s within the Killer\'s Terror Radius, while crouched and idle, use <b>E</b> to throw a pebble <b>20</b>m away:<ul><li>The Killer is alerted.</li><li>The pebble leaves Scratch Marks.</li></ul>`,
            quote: '"There\'s what is easy and then there\'s what is right. If you confuse the two, there\'s no telling what you become."-Adam Francis',
          },
          perk2: {
            name: "Deliverance",
            description:`Once per trial, when you safely unhook another Survivor, you can unhook yourself, When you unhook yourself this way, you gain ${colorR("Broken")} for ${tiers(160, 140, 120,)}s.`,
            quote:'"I was raised by a strict man who taught me how to make the best of a bad situation."-Adam Francis'
          },
          perk3: {

            quote:'"There\'s no limit to what you can achieve, as long as you back it up with hard work."-Adam Francis'
          },
        },
        "Jeff Johansen": {
          perk1: {
            name: "Breakdown",

          perk2: {

            quote:'"Oil work to honor my best buddies, the best musicians I know. Their album got me through dark times."-Jeff, oil on canvas, 16x16'

          perk3: {
            name: "Distortion",
            description:`When the trial starts, and after being chased for <b>15</b>s, you earn <b>1</b> Token, up to <b>2</b>.<br><br>While not downed, whenever the Killer attempts to see your Aura, spend <b>1</b> Token. Then, for the next ${tiers(8, 10, 12)}s:<ul><li>The Killer cannot see your Aura</li><li>You leave no Scratch Marks.</li></ul>}`,

        "Jane Romero": {

          perk3: {

        "Steve Harrington": {

        "Zarina Kassir": {

        "Lee Yun-Jin": {

        "Jill Valentine": {

        "Leon Scott Kennedy": {

        "Mikaela Reid": {

        "Jonah Vasquez": {

        "Yoichi Asakawa": {

      let currentType = localStorage.getItem("currentType") || "killers";

      function showIcons(type) {
        const container = document.getElementById("iconsContainer");
        container.innerHTML = "";

        const icons = type === "killers" ? killerIcons : survivorIcons;

        icons.forEach((icon, index) => {
          const div = document.createElement("div");
          div.className = "icon";
          div.dataset.name = icon.name;
          div.onclick = () => toggleCheck(div, index);

          const img = document.createElement("img");
          img.src = icon.src;
          img.alt = icon.name;
          div.appendChild(img);

          const overlay = document.createElement("div");
          overlay.className = "icon-overlay";
          const span = document.createElement("span");
          span.textContent = icon.name;
          overlay.appendChild(span);

          const imagesContainer = document.createElement("div");
          imagesContainer.className = "icon-images";

          if (icon.hoverImages && icon.hoverImages.length === 3) {
            icon.hoverImages.forEach((src, i) => {
              const img = document.createElement("img");
              img.src = src;
              img.alt = `${icon.name} - Hover ${i + 1}`;

              if (i === 2) {
                img.className = "bottom-img";
              }

              const tooltip = document.createElement("div");
              tooltip.className = "perk-tooltip";

              const perkName = document.createElement("h3");
              perkName.textContent = getPerkName(icon.name, i + 1);
              tooltip.appendChild(perkName);

              const dividerContainer = document.createElement("div");
              dividerContainer.className = "divider-container";

              const divider = document.createElement("div");
              divider.className = "divider";

              dividerContainer.appendChild(divider);
              tooltip.appendChild(dividerContainer);

              const characterInfo = document.createElement("div");
              characterInfo.className = "character-info";

              const characterName = document.createElement("div");
              characterName.className = "character-name";
              characterName.textContent = icon.name;

              const rarity = document.createElement("div");
              rarity.className = "rarity";
              rarity.textContent = "TEACHABLE";

              characterInfo.appendChild(characterName);
              characterInfo.appendChild(rarity);
              tooltip.appendChild(characterInfo);

              const description = document.createElement("p");
              description.innerHTML = getPerkDescription(icon.name, i + 1);
              tooltip.appendChild(description);

              const quoteText = getPerkQuote(icon.name, i + 1);

                if (quoteText && quoteText.trim() !== '""') {
                    const quote = document.createElement("div");
                    quote.className = "quote";
                    quote.textContent = quoteText;
                    tooltip.appendChild(quote);
                }

              document.body.appendChild(tooltip);
              imagesContainer.appendChild(img);

              img.addEventListener("mouseenter", (e) => {
                const rect = img.getBoundingClientRect();

                tooltip.style.left = rect.right + 10 + "px";
                tooltip.style.top = rect.top + "px";

                const tooltipRect = tooltip.getBoundingClientRect();
                const viewportWidth = window.innerWidth;
                const viewportHeight = window.innerHeight;

                if (tooltipRect.right > viewportWidth) {
                  tooltip.style.left =
                    rect.left - tooltipRect.width - 10 + "px";
                }

                if (tooltipRect.bottom > viewportHeight) {
                  tooltip.style.top =
                    viewportHeight - tooltipRect.height - 10 + "px";
                }

                tooltip.classList.add("visible");
              });

              img.addEventListener("mouseleave", () => {
                tooltip.classList.remove("visible");
              });
            });
          }

          overlay.appendChild(imagesContainer);
          div.appendChild(overlay);
          container.appendChild(div);
        });

        currentType = type;
        localStorage.setItem("currentType", type);
        loadState();
      }

      function toggleCheck(element, index) {
        element.classList.toggle("checked");
        saveState();
      }

      function saveState() {
        const icons = document.querySelectorAll(".icon");
        const checkedStates = {};

        icons.forEach((icon) => {
          if (icon.classList.contains("checked")) {
            const name = icon.dataset.name;
            checkedStates[name] = true;
          }
        });

        localStorage.setItem(
          `checkedIcons_${currentType}`,
          JSON.stringify(checkedStates),
        );
      }

      function loadState() {
        const icons = document.querySelectorAll(".icon");
        const checkedStates =
          JSON.parse(localStorage.getItem(`checkedIcons_${currentType}`)) || {};

        icons.forEach((icon) => {
          const name = icon.dataset.name;
          if (checkedStates[name]) {
            icon.classList.add("checked");
          } else {
            icon.classList.remove("checked");
          }
        });
      }

      function filterIcons() {
        const input = document.getElementById("search").value.toLowerCase();
        const icons = document.querySelectorAll(".icon");

        icons.forEach((icon) => {
          const alt = icon.querySelector("img").alt.toLowerCase();
          icon.style.display = alt.includes(input) ? "block" : "none";
        });
      }

      function getPerkName(iconName, perkNumber) {
        const killerData = perkData[iconName];
        if (!killerData) return "Perk Name";
        const perkKey = `perk${perkNumber}`;
        return killerData[perkKey]?.name || "Perk Name";
      }

      function getPerkDescription(iconName, perkNumber) {
        const killerData = perkData[iconName];
        if (!killerData) return "Perk description goes here.";
        const perkKey = `perk${perkNumber}`;
        return (
          killerData[perkKey]?.description || "Perk description goes here."
        );
      }

      function getPerkQuote(iconName, perkNumber) {
        const killerData = perkData[iconName];
        if (!killerData) return '"Perk quote goes here."';
        const perkKey = `perk${perkNumber}`;
        return killerData[perkKey]?.quote || '"Perk quote goes here."';
      }

      window.onload = () => {
        showIcons(currentType);
        loadState();
      };

      const script = document.createElement("script");
      script.src = "main.js?v=" + new Date().getTime();
      document.head.appendChild(script);
    </script></script>
  </body>
</html>

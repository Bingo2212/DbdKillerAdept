<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBD Adept Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perk-bg.css">
    <script src="script.js"></script>
  </head>
  <body>
    <div class="buttons">
      <button onclick="createIcons('killers')">Killers</button>
      <button onclick="createIcons('survivors')">Survivors</button>
    </div>

    <div class="image-sources">
      <span class="sources-text">Image sources:</span>
      <a
        href="https://deadbydaylight.wiki.gg/"
        target="_blank"
        class="sources-link"
        >here</a
      >
    </div>

    <input
      type="text"
      id="search"
      placeholder="Search..."
      oninput="filterIcons()"
    />
    <main class="icons-container" id="iconsContainer"></main>
  </body>
</html>
